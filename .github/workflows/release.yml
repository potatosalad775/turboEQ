name: Release

# Push a tag `v<version>` matching package.json to publish that version to npm.
# Authenticates by npm trusted publishing (OIDC), so the repo holds no npm token;
# the package's settings on npmjs.com name this repo and this file as its publisher.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # `prepack` builds both wasm files into js/. A prerelease version
      # (0.3.0-beta.1) goes out under `next`, so `npm install` does not pick it up.
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
